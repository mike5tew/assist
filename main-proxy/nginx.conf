# This is the configuration for the main Vultr reverse proxy.

# Define the upstream services. These names must match the service names
# in the docker-compose file used on the Vultr server.

upstream assist_frontend {
    server assist-frontend:80;
}

upstream assist_api {
    server assist-api:8080;
}


server {
    listen 80;
    server_name _; # Listen on all hostnames

    # Health check endpoint for monitoring
    location /health {
        return 200 "OK";
        access_log off;
    }

    # --- FRONTENDS ---

    location /esp-organizer/ {
        # This rewrite is essential. It strips /esp-organizer/ from the path.
        rewrite ^/esp-organizer/(.*)$ /$1 break;
        proxy_pass http://assist-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /skillstree/ {
        # Skills tree app - currently not available in dev setup
        # To enable: add skills-frontend service to docker-compose
        return 503;
    }

    # --- APIS ---

    # Root /api/ routes (for frontend at /esp-organizer/ making relative calls)
    location /api/ {
        proxy_pass http://assist-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /esp-organizer/api/ {
        proxy_pass http://assist-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /skillstree/api/ {
        # Skills API - currently not available in dev setup
        return 503;
    }
}