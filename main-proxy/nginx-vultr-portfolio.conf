# Main Vultr Reverse Proxy Configuration
# Updated: 2026-02-07
# Purpose: Serve portfolio at root, ESP tools at subpaths, DRB at /drb/

# Upstream services
upstream assist_frontend {
    server assist-frontend:80;
}

upstream assist_api {
    server assist-api:8080;
}

upstream skills_frontend {
    server skills-frontend:80;
}

upstream skills_api {
    server skills-api:8080;
}

# DRB (MAT Strategic Dashboard)
upstream drb_frontend {
    server drb-frontend:80;
}

upstream drb_api {
    server drb-api:8082;
}

# ============================================================
# SERVER 1: HTTP — handles Let's Encrypt + redirects to HTTPS
# (Once SSL is working, all real traffic goes through Server 2)
# ============================================================
server {
    listen 80;
    server_name espthinking.co.uk www.espthinking.co.uk;

    # Let's Encrypt challenge (must stay on HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# SERVER 1b: HTTP fallback for localhost / IP access (dev/testing)
# Serves the site without SSL when accessed by IP or localhost
# ============================================================
server {
    listen 80 default_server;
    server_name _;

    location /health {
        return 200 "OK";
        access_log off;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://assist_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://assist_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /skillstree/api/ {
        rewrite ^/skillstree/api/(.*)$ /api/$1 break;
        proxy_pass http://skills_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /drb/api/ {
        rewrite ^/drb/api/(.*)$ /api/$1 break;
        proxy_pass http://drb_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /drb/ {
        rewrite ^/drb/(.*)$ /$1 break;
        proxy_pass http://drb_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /esp-organizer/ {
        rewrite ^/esp-organizer/(.*)$ /$1 break;
        proxy_pass http://assist_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /skillstree/ {
        rewrite ^/skillstree/(.*)$ /$1 break;
        proxy_pass http://skills_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================================
# SERVER 2: HTTPS — the real production server for espthinking.co.uk
# ============================================================
server {
    listen 443 ssl http2;
    server_name espthinking.co.uk www.espthinking.co.uk;

    ssl_certificate     /etc/letsencrypt/live/espthinking.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/espthinking.co.uk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /health {
        return 200 "OK";
        access_log off;
    }

    # Portfolio Landing
    location / {
        proxy_pass http://assist_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ESP Platform API
    location /api/ {
        proxy_pass http://assist_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Skills Tree API
    location /skillstree/api/ {
        rewrite ^/skillstree/api/(.*)$ /api/$1 break;
        proxy_pass http://skills_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DRB API
    location /drb/api/ {
        rewrite ^/drb/api/(.*)$ /api/$1 break;
        proxy_pass http://drb_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DRB frontend
    location /drb/ {
        rewrite ^/drb/(.*)$ /$1 break;
        proxy_pass http://drb_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy ESP Organizer
    location /esp-organizer/ {
        rewrite ^/esp-organizer/(.*)$ /$1 break;
        proxy_pass http://assist_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Skills Tree frontend
    location /skillstree/ {
        rewrite ^/skillstree/(.*)$ /$1 break;
        proxy_pass http://skills_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
