name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Build
      working-directory: ./esp-organizer
      run: |
        go mod download
        go build -v ./...
    
    - name: Test
      working-directory: ./esp-organizer
      run: go test -v ./...
