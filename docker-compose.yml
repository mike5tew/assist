services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: esp_mongodb
    env_file:
      - .env
    ports:
      - "27017:27017"
    environment:
      # These override any .env values
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password123}
    volumes:
      - mongodb_data:/data/db
    networks:
      - esp_organizer_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping: 1})"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Weaviate Vector Database - ARM64 Compatible
  weaviate:
    image: semitechnologies/weaviate:1.25.4
    container_name: esp_weaviate
    ports:
      - "8081:8080"
      - "50051:50051"
    restart: on-failure:0
    env_file:
      - .env
    environment:
      # Disable authentication for development
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      AUTHENTICATION_APIKEY_ENABLED: 'false'
      
      # Vectorizer configuration for AWS Bedrock
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-aws'
      ENABLE_MODULES: 'text2vec-aws'
      CLUSTER_HOSTNAME: 'node1'
      
      # AWS configuration from .env
      TEXT2VEC_AWS_REGION: ${AWS_REGION:-eu-west-2}
      AWS_REGION: ${AWS_REGION:-eu-west-2}
      TEXT2VEC_AWS_MODEL_ID: 'amazon.titan-embed-text-v2:0'
      AWS_BEDROCK_EMBEDDING_MODEL_ID: ${AWS_BEDROCK_EMBEDDING_MODEL_ID:-amazon.titan-embed-text-v2:0}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - esp_organizer_network
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # API Service - Development mode
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: esp_assist_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Override with Docker container-to-container networking
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-password123}@mongodb:27017/${MONGO_DB_NAME:-esp_organizer}?authSource=${MONGO_AUTH_SOURCE:-admin}
      WEAVIATE_URL: http://weaviate:8080
      # ...existing env vars from .env...
    depends_on:
      mongodb:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    networks:
      - esp_organizer_network
    restart: on-failure:5
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Frontend Service - Development mode
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: esp_assist_frontend
    ports:
      - "3000:80"
    environment:
      # This is for the browser, which accesses the API via the Nginx proxy on the same host.
      # This value is correct for the browser's perspective.
      REACT_APP_API_URL: http://localhost:3000
      REACT_APP_ENVIRONMENT: production
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - esp_organizer_network

networks:
  esp_organizer_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  weaviate_data:
    driver: local