services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: esp_mongodb
    env_file:
      - .env.prod
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - esp_organizer_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Weaviate Vector Database
  weaviate:
    image: semitechnologies/weaviate:1.25.4
    container_name: esp_weaviate
    ports:
      - "8081:8080"
      - "50051:50051"
    restart: on-failure:0
    env_file:
      - .env.prod
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-aws'
      ENABLE_MODULES: 'text2vec-aws' # <-- This was empty, now it's enabled
      CLUSTER_HOSTNAME: 'node1'
      AWS_REGION: ${AWS_REGION} # <-- Added to ensure module has region
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - esp_organizer_network
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # API Service - Development mode
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile # <-- This now points to the new Dockerfile
    container_name: esp_assist_api
    ports:
      - "8080:8080"
    env_file:
      - .env.prod
    environment:
      # Construct container-specific URIs here, overriding any from .env
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB_NAME}?authSource=${MONGO_AUTH_SOURCE}
      - WEAVIATE_URL=http://weaviate:8080
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    depends_on:
      mongodb:
        condition: service_healthy  # ← Wait for MongoDB to be healthy
      weaviate:
        condition: service_healthy  # ← Wait for Weaviate to be healthy
    networks:
      - esp_organizer_network
    restart: on-failure:5  # ← Auto-restart on failure (max 5 times)
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Nginx Production Service
  # Nginx service now serves static files and acts as a reverse proxy
  nginx-local:
    image: nginx:latest
    container_name: esp_nginx_local
    .env_file:
      - .env.prod 
    ports:
      - "8088:80"  # Change from 3000:80 to 8088:80 to avoid conflict
    volumes:
      - ./frontend/build:/usr/share/nginx/html              # Serve static build
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf  # Mount your SPA + API proxy config
    depends_on:
      - api
    networks:
      - esp_organizer_network
    restart: unless-stopped

  # Frontend Service - Development mode
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: esp_assist_frontend
    ports:
      - "3000:3000"  # Keep this for direct frontend access
    env_file:
      - .env.prod
    environment:
      - REACT_APP_API_URL=/api  
      - REACT_APP_ENVIRONMENT=Docker
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - esp_organizer_network
    restart: unless-stopped

networks:
  esp_organizer_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  weaviate_data:
    driver: local