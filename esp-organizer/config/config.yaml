database:
  mongodb:
    uri: "mongodb://admin:password123@localhost:27017/esp_organizer?authSource=admin"
    database: "esp_organizer"
    collections:
      skills: "skills"
      sources: "sources"
  weaviate:
    host: "localhost:8081"
    scheme: "http"
    classes:
      skills: "Skills"

llm:
  provider: "dummy"  # Current implementation
  model: "deterministic-embeddings"
  version: "development"
  future_integration:
    providers: ["openai", "llama", "huggingface"]
    ready: true

server:
  port: "8081"  # Changed from 8080 to 8081
  timeout: 30s
  cors:
    enabled: true
    origins: ["*"]

api:
  endpoints:
    semantic_query: "/api/skills/semantic-query"
    raw_text: "/rawTextPOST"
    materials: "/materials"
  features:
    llm_ready_responses: true
    semantic_insights: true
    confidence_scoring: true

development:
  cli_tools:
    upload_skills: "cmd/upload-skills/main.go"
    debug_embeddings: "cmd/debug-embeddings/main.go"
    query_test: "cmd/query-test/main.go"
    analyze_results: "cmd/analyze-results/main.go"
    clear_db: "cmd/clear-db/main.go"
  data:
    skills_json: "internal/api/temp/skills.json"
    skills_count: 62
  makefile_commands: ["setup", "clear", "upload", "debug", "test", "server", "dev-workflow"]

logging:
  level: "info"
  format: "text"
  components:
    - "mongodb"
    - "weaviate"
    - "llm"
    - "api"

production:
  deployment:
    platform: "vultr"
    os: "alpine_linux"
    reverse_proxy: "esp-nginx"
  environment_variables:
    required:
      - "MONGO_INITDB_ROOT_USERNAME"
      - "MONGO_INITDB_ROOT_PASSWORD"
    optional:
      - "MONGODB_URI"
      - "OPENAI_API_KEY"
      - "LLAMA_API_URL"

extraction:
  textract:
    enabled: true
    aws_region: "eu-west-2"
    s3_bucket: "esp-organizer-documents"
    max_file_size: "50MB"
    supported_formats: ["pdf", "jpeg", "png", "tiff"]
  processing:
    chunk_size: 1000
    overlap_size: 100
    auto_vectorize: true