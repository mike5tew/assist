# Development & Production Nginx Configuration
server {
    listen 80;
    server_name localhost;

    # Add Docker's internal DNS resolver. This is the key to fixing the 502 error.
    # It allows Nginx to find the 'api' service by its name.
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 50M;
    root /usr/share/nginx/html;
    index index.html;

    # Serve SPA static files with client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        # Prevent caching of index.html
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # API Proxy - Routes /api/* to backend
    location /api/ {
        # Use the Docker service name 'api' which is resolved by Docker's internal DNS
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # Essential headers for proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Timeouts for longer requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        # Handle preflight OPTIONS requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
