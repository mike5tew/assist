# Self-contained Nginx config for the assist-frontend SPA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files and manifest without redirecting to index.html
    location ~* ^/(manifest\.json|robots\.txt|favicon\.ico|logo\d+\.png)$ {
        try_files $uri =404;
        expires 1d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Support serving the app when it is mounted under /esp-organizer/
    location /esp-organizer/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }
}
