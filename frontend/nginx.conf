# /frontend/nginx.conf
# This configuration is for the standalone frontend container.
# It serves the static React build and handles client-side routing.

server {
    listen 80;
    server_name localhost;

    # Root directory for the static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Handle client-side routing for single-page applications (SPA)
    # This ensures that refreshing a page on a route like /immunology
    # still serves the main index.html file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Add headers to prevent caching issues during development
    add_header 'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    expires off;
    etag off;
}
