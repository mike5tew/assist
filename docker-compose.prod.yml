# Version: 2.0
# This is the single source of truth for the production environment on Vultr.
# It correctly maps variables from the .env file to the containers.

services:
  # --- REVERSE PROXY ---
  main-proxy:
    image: mike5tew/main-proxy:latest
    container_name: main-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./main-proxy/nginx-vultr-portfolio.conf:/etc/nginx/conf.d/default.conf
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - shared-network

  # --- SSL CERTIFICATE MANAGEMENT ---
  # Run once: docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d espthinking.co.uk -d www.espthinking.co.uk
  # Renew: docker compose run --rm certbot renew
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    profiles:
      - ssl  # Only runs when explicitly invoked: docker compose --profile ssl run certbot

  # --- ASSIST APP ---
  assist-frontend:
    image: mike5tew/assist-frontend:latest
    container_name: assist-frontend
    restart: always
    networks:
      - shared-network

  assist-api:
    image: mike5tew/assist-api:latest
    container_name: assist-api
    restart: always
    env_file: .env
    environment:
      API_PORT: "8080"
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/esp_organizer?authSource=admin
    expose:
      - "8080"
    depends_on:
      - mongodb
    networks:
      - shared-network

  # --- SKILLS MAP PLATFORM ---
  skills-frontend:
    image: mike5tew/skills-frontend:latest
    container_name: skills-frontend
    restart: always
    networks:
      - shared-network

  skills-api:
    image: mike5tew/skills-api:latest
    container_name: skills-api
    restart: always
    env_file: .env
    environment:
      WEAVIATE_URL: http://weaviate:8080
      DB_HOST: skills-db
      DB_PORT: "3306"
    expose:
      - "8080"
    depends_on:
      - skills-db
      - weaviate
    networks:
      - shared-network

  # --- DRB (Trust Financial & Estates Monitor) ---
  drb-frontend:
    image: mike5tew/drb-frontend:latest
    container_name: drb-frontend
    restart: always
    networks:
      - shared-network
    depends_on:
      - drb-api

  drb-api:
    image: mike5tew/drb-api:latest
    container_name: drb-api
    restart: always
    expose:
      - "8082"
    environment:
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/drb_monitor?authSource=admin
    depends_on:
      - mongodb
    networks:
      - shared-network

  # --- DATABASES ---
  skills-db:
    image: mysql:8.0
    container_name: skills-db
    restart: always
    env_file: .env
    environment:
      # This mapping is the critical fix.
      # It takes DB_... from the .env file and provides them as MYSQL_... to the container.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - skills_db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shared-network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    env_file: .env
    environment:
      # This mapping is also required for the MongoDB container.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - shared-network

  weaviate:
    image: semitechnologies/weaviate:1.24.10
    container_name: weaviate
    restart: always
    ports:
      - "8088:8080"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-aws'
      ENABLE_MODULES: 'text2vec-aws'
      AWS_REGION: 'us-east-1' # This can be any region, needed for the module to activate
      CLUSTER_HOSTNAME: 'node1'
    networks:
      - shared-network

volumes:
  skills_db_data:
  mongodb_data:
  weaviate_data:
  certbot_www:
  certbot_certs:

networks:
  shared-network:
    driver: bridge