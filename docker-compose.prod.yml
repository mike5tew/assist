version: '3.8'

services:
  # MongoDB - Production (external service)
  # In production, you typically use a managed service (MongoDB Atlas, AWS DocumentDB, etc.)
  # This is optional if you use a managed MongoDB service
  
  # Weaviate Vector Database - Production
  weaviate:
    image: semitechnologies/weaviate:1.25.4
    container_name: esp_weaviate_prod
    ports:
      - "8081:8080"
      - "50051:50051"
    restart: always
    env_file:
      - .env.production
    environment:
      # Strict authentication for production
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'
      AUTHENTICATION_APIKEY_ENABLED: 'true'
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY}
      AUTHENTICATION_APIKEY_USERS: 'esp-organizer'
      
      # Vectorizer configuration
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-aws'
      ENABLE_MODULES: 'text2vec-aws'
      CLUSTER_HOSTNAME: 'node1'
      
      # AWS Bedrock configuration
      TEXT2VEC_AWS_REGION: ${AWS_REGION}
      AWS_REGION: ${AWS_REGION}
      TEXT2VEC_AWS_MODEL_ID: 'amazon.titan-embed-text-v2:0'
      AWS_BEDROCK_EMBEDDING_MODEL_ID: ${AWS_BEDROCK_EMBEDDING_MODEL_ID}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - weaviate_data_prod:/var/lib/weaviate
    networks:
      - esp_organizer_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # API Service - Production
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: esp_assist_api_prod
    ports:
      - "8080:8080"
    env_file:
      - .env.production
    environment:
      # Production MongoDB (typically managed service like MongoDB Atlas)
      MONGODB_URI: ${MONGODB_URI}
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
      # ...existing vars from .env.production...
    depends_on:
      weaviate:
        condition: service_healthy
    networks:
      - esp_organizer_network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Nginx Reverse Proxy - Production
  nginx:
    image: nginx:alpine
    container_name: esp_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/build:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro  # SSL certificates
    depends_on:
      - api
    networks:
      - esp_organizer_network
    restart: always

networks:
  esp_organizer_network:
    driver: bridge

volumes:
  weaviate_data_prod:
    driver: local