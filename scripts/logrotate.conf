# Example logrotate configuration for esp-organizer logs
# Install this as /etc/logrotate.d/esp-organizer on your server.

/opt/esp/logs/*.log {
    daily
    rotate 14
    compress
    missingok
    notifempty
    copytruncate
    create 0640 root root
}

# If your app writes logs to a different location (e.g., /var/log/esp/ or the app working dir),
# update the path accordingly.
